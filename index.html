<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser features info</title>
</head>
<body>
  <script>
  function includesAny(text, ...searchStrings) {
    // console.log(`[includesAny] text=${text} search=${JSON.stringify(searchStrings)}`)
    for (const search of searchStrings) {
      if (text.includes(search)) return true;
    };
    return false;
  }

  function detectInAppBrowser() {
    const ua = window.navigator.userAgent.toLowerCase();

    // facebook
    if (includesAny(ua, 'fbios', 'fb_iab')) return 'facebook';

    // instagram
    if (ua.includes('instagram')) return 'instagram';

    // LINE
    if (includesAny(ua, ' line/', ' liff')) return 'LINE';

    // Threads
    if (ua.includes('barcelona')) return 'Threads';

    // Ex-Twitter
    if (ua.includes('twitter')) return 'Twitter';

    return null;
  }
  </script>

  <h1>Browser features information</h1>
  <ul>
    <li>user-agent : <script>document.write(window.navigator.userAgent)</script></li>
    <li>in-app browser detection : <script>document.write(detectInAppBrowser())</script></li>
    <li>window.speechSynthesis : <script>document.write(window.speechSynthesis != null ? 'exists' : 'not found')</script></li>
    <li>speech recognition : <script>document.write((SpeechRecognition || webkitSpeechRecognition) != null ? 'exists' : 'not found')</script></li>
  </ul>
</body>
</html>
